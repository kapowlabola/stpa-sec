name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            Review this PR's diff. Be specific — reference exact files and
            line numbers. Rate each finding CRITICAL, HIGH, MEDIUM, or LOW.
            Do not approve or merge; leave findings as a comment only.